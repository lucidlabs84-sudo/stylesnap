<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StyleSnap Test Page</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 40px;
    }
    h1 { color: #333; }
    .test-section {
      margin: 20px 0;
      padding: 20px;
      border: 1px solid #ddd;
    }
  </style>
</head>
<body>
  <h1>Hello StyleSnap</h1>
  
  <div class="test-section">
    <h2>Test Element 1</h2>
    <p>This is a test paragraph with some text.</p>
    <button id="test-btn">Test Button</button>
  </div>

  <div class="test-section">
    <h2>Test Element 2</h2>
    <input type="text" placeholder="Test input">
    <a href="#" id="test-link">Test Link</a>
  </div>

  <div class="test-section" id="section3">
    <h2>Test Element 3</h2>
    <ul>
      <li>Item 1</li>
      <li>Item 2</li>
      <li>Item 3</li>
    </ul>
  </div>
</body>
</html>
